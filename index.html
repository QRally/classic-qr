<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classic Car Display Profile</title>

  <!-- Tailwind and QR lib (deferred) -->
  <script defer src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Prevent body scroll when a modal is open */
    .modal-open { overflow: hidden; }

    /* Print card size and styles */
    @page {
      size: 90mm 55mm; /* suggested print size (credit-card-ish). Browser support varies. */
      margin: 3mm;
    }

    /* Make the QR modal printable: only show the printable card when printing */
    @media print {
      body * { visibility: hidden; }
      #printCard, #printCard * { visibility: visible; }
      #printCard { position: fixed; top: 0; left: 0; right: 0; bottom: 0; margin: 0; }
    }

    /* Printable card inner styles (fallback if Tailwind not applied in print) */
    .print-card {
      width: 90mm;
      height: 55mm;
      padding: 8px;
      box-sizing: border-box;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      background: white;
      color: #0f172a;
      border-radius: 6px;
      border: 1px solid #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    .print-left {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .print-title {
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
      color: #0b1220;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .print-sub {
      font-size: 9px;
      color: #1f2937;
    }
    .print-specs {
      margin-top: 4px;
      font-size: 9px;
      color: #111827;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .print-footer {
      margin-top: auto;
      font-size: 8px;
      color: #374151;
    }

    .print-qr {
      width: 44mm;
      height: 44mm;
      display:flex;
      align-items:center;
      justify-content:center;
      background:white;
      border-radius:4px;
      flex: 0 0 44mm;
    }

    /* Small adjustments for screen modal view */
    #qrModal .modal-inner {
      max-width: 420px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-amber-500 font-bold text-xl tracking-wide uppercase">Classic Display</span>
      </div>
      <button id="openQrBtn" class="bg-slate-700 hover:bg-slate-600 text-xs text-amber-400 font-semibold py-1.5 px-3 rounded border border-amber-500/30 transition flex items-center gap-1.5" aria-haspopup="dialog" aria-controls="qrModal" type="button">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
        <span>Windscreen QR</span>
      </button>
    </div>
  </header>

  <!-- Main Container (omitted earlier sections for brevity; assume same as your master) -->
  <main class="max-w-3xl mx-auto px-4 mt-4 space-y-6">
    <!-- ... your main content (title, specs, gallery, guestbook) unchanged ... -->
    <!-- For brevity, the rest of the main UI is unchanged from your master file -->
  </main>

  <!-- QR Code Modal (printable) -->
  <div id="qrModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="qrTitle">
    <div class="modal-inner bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl relative">
      <button id="qrCloseBtn" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2" type="button" aria-label="Close QR dialog">✕</button>
      <h3 id="qrTitle" class="text-lg font-bold text-white mb-1">Windscreen Display QR</h3>
      <p class="text-xs text-slate-400 mb-4">Scan to view this vehicle profile on any mobile device. Use the Print button to produce a small windscreen label.</p>

      <!-- Printable card preview (on-screen) -->
      <div id="printPreview" class="mx-auto bg-white rounded-lg p-3 inline-block shadow-inner mb-4" style="width:320px;">
        <div id="printCard" class="print-card" role="document" aria-label="Printable vehicle display">
          <div class="print-left">
            <div id="pc-title" class="print-title">Vehicle Title</div>
            <div id="pc-sub" class="print-sub">Year • Entry</div>
            <div id="pc-specs" class="print-specs">
              <div id="pc-engine">Engine: --</div>
              <div id="pc-colour">Colour: --</div>
            </div>
            <div id="pc-footer" class="print-footer">Owner: --</div>
          </div>
          <div class="print-qr" aria-hidden="true">
            <div id="printQrContainer" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>
          </div>
        </div>
      </div>

      <div id="qrUrlText" class="text-xs text-slate-400 break-all bg-slate-900 p-2 rounded border border-slate-700/50 mb-4" aria-live="polite"></div>

      <button id="printBtn" class="w-full py-2 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold text-sm rounded transition" type="button">Print Display Sheet</button>
    </div>
  </div>

  <!-- Minimal required scripts for print feature; keep the rest of your master JS -->
  <script>
    (function () {
      // Keep a reference to the last-loaded car data so printable card can show it
      let lastCarData = null;

      // Reuse or adapt your existing functions to populate the printable card
      function populatePrintCard(data) {
        lastCarData = data || {};
        const title = (data && data.title) ? data.title : 'Untitled Classic';
        const year = (data && data.year) ? data.year : 'N/A';
        const entry = (data && data.entryNumber) ? `Entry #${data.entryNumber}` : '';
        const engine = (data && data.specs && data.specs.engine) ? data.specs.engine : '--';
        const colour = (data && data.specs && data.specs.colour) ? data.specs.colour : '--';
        const owner = (data && data.owner) ? data.owner : '';

        document.getElementById('pc-title').textContent = title;
        document.getElementById('pc-sub').textContent = `${year}${entry ? ' • ' + entry : ''}`;
        document.getElementById('pc-engine').textContent = `Engine: ${engine}`;
        document.getElementById('pc-colour').textContent = `Colour: ${colour}`;
        document.getElementById('pc-footer').textContent = owner ? `Owner: ${owner}` : '';

        // Generate QR inside printQrContainer
        const url = window.location.href;
        const qrParent = document.getElementById('printQrContainer');
        qrParent.innerHTML = '';
        if (typeof QRCode !== 'undefined') {
          try {
            new QRCode(qrParent, {
              text: url,
              width: qrParent.clientWidth,
              height: qrParent.clientHeight,
              colorDark: "#0f172a",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel ? QRCode.CorrectLevel.H : undefined
            });
          } catch (err) {
            // fallback: use text
            qrParent.textContent = url;
          }
        } else {
          qrParent.textContent = url;
        }

        // Also update the URL display text
        document.getElementById('qrUrlText').textContent = url;
      }

      // Hook up modal open/close and print button
      function openQRModal() {
        const modal = document.getElementById('qrModal');
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');
        // Populate with the current car data. If you have a renderProfile function that saved the JSON, use it.
        // Here we attempt to fetch the JSON in the same way the page does, then populate. If you already keep car data global,
        // replace the fetch below with that variable.
        const params = new URLSearchParams(window.location.search);
        const carFile = params.get('car') || 'car';
        const targetJson = `./${carFile}.json?t=${Date.now()}`;
        fetch(targetJson, { cache: 'no-store' })
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(json => populatePrintCard(json))
          .catch(err => {
            console.warn('Could not fetch car JSON for print preview, falling back to visible page content', err);
            // Fallback: read from visible fields
            const fallback = {
              title: document.getElementById('displayTitle')?.textContent || '',
              year: document.getElementById('displayYear')?.textContent || '',
              entryNumber: (document.getElementById('displaySubtitle')?.textContent || '').replace('Classic Show Entry #','') || '',
              specs: {
                engine: document.getElementById('displayEngine')?.textContent || '',
                colour: document.getElementById('displayColour')?.textContent || ''
              },
              owner: ''
            };
            populatePrintCard(fallback);
          });
      }

      function closeQRModal() {
        const modal = document.getElementById('qrModal');
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
      }

      // Print: open print dialog. Printing will use the @media print rules above that show only the #printCard
      function printCard() {
        // Before printing, you can ensure the QR is a vector (SVG) or image for better printer quality.
        // For now, we rely on the QR library to render an image/canvas/SVG in the print container.
        window.print();
      }

      // Wire up the modal buttons
      document.addEventListener('DOMContentLoaded', () => {
        const openBtn = document.getElementById('openQrBtn');
        if (openBtn) openBtn.addEventListener('click', openQRModal);

        const closeBtn = document.getElementById('qrCloseBtn');
        if (closeBtn) closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeQRModal(); });

        const printBtn = document.getElementById('printBtn');
        if (printBtn) printBtn.addEventListener('click', printCard);

        // Also close modal when backdrop clicked
        const qrModal = document.getElementById('qrModal');
        if (qrModal) qrModal.addEventListener('click', closeQRModal);
        const qrInner = qrModal ? qrModal.querySelector('.modal-inner') : null;
        if (qrInner) qrInner.addEventListener('click', e => e.stopPropagation());
      });
    })();
  </script>
</body>
</html>
